<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>micro:bit RADAR</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020605;
    color: #00ff88;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

/* --------------------
   상단
-------------------- */

header {
    height: 70px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid #0b3d28;
}

.title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    padding: 10px 18px;

    background: #06150e;
    color: #00ff88;

    border: 1px solid #00ff88;
    border-radius: 6px;

    font-size: 14px;
}

button:active {
    background: #00ff88;
    color: black;
}

#status {
    color: #888;
}

/* --------------------
   레이더
-------------------- */

main {
    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 0;
}

#radarContainer {
    width: min(90vw, 750px);
    height: min(90vw, 750px);
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* --------------------
   정보
-------------------- */

.info {

    position: fixed;

    left: 20px;
    bottom: 20px;

    padding: 14px 18px;

    background: rgba(0, 10, 5, 0.85);

    border: 1px solid #0b3d28;

    border-radius: 8px;
}

.info div {
    margin: 4px 0;
}

.value {
    font-size: 20px;
}

/* 연결 안 됨 */
.warning {
    color: #ff5555;
}

</style>

</head>

<body>

<header>

    <div class="title">
        MICRO:BIT RADAR
    </div>

    <div class="controls">

        <button id="connectButton">
            Bluetooth 연결
        </button>

        <span id="status">
            연결 안 됨
        </span>

    </div>

</header>

<main>

    <div id="radarContainer">

        <canvas id="radarCanvas"></canvas>

    </div>

</main>

<div class="info">

    <div>
        ANGLE :
        <span class="value" id="angleValue">---</span>
        °
    </div>

    <div>
        DISTANCE :
        <span class="value" id="distanceValue">---</span>
        cm
    </div>

</div>

<script>

/* =====================================================
   Canvas
===================================================== */

const canvas =
    document.getElementById("radarCanvas");

const ctx =
    canvas.getContext("2d");

let canvasWidth = 0;
let canvasHeight = 0;

let centerX = 0;
let centerY = 0;
let radarRadius = 0;

/* =====================================================
   레이더 상태
===================================================== */

let currentAngle = 90;
let currentDistance = 300;

let connected = false;

/*
    최근 감지된 물체를 저장

    key = 각도
    value = 거리
*/

const targets = new Map();

/* =====================================================
   Canvas 크기
===================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    canvasWidth = rect.width;
    canvasHeight = rect.height;

    centerX =
        canvasWidth / 2;

    centerY =
        canvasHeight * 0.86;

    radarRadius =
        Math.min(
            canvasWidth * 0.43,
            canvasHeight * 0.72
        );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

/* =====================================================
   각도 → 라디안

   0°   = 오른쪽
   90°  = 위
   180° = 왼쪽
===================================================== */

function angleToRad(angle) {

    return angle * Math.PI / 180;

}

/* =====================================================
   극좌표 → 화면 좌표
===================================================== */

function polarToScreen(
    angle,
    distance
) {

    const rad =
        angleToRad(angle);

    const x =
        centerX +
        Math.cos(rad) *
        distance;

    const y =
        centerY -
        Math.sin(rad) *
        distance;

    return {
        x: x,
        y: y
    };

}

/* =====================================================
   레이더 그리기
===================================================== */

function drawRadar() {

    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );

    /* ---------------------
       배경
    --------------------- */

    ctx.fillStyle = "#020605";

    ctx.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );

    /* ---------------------
       거리 원
    --------------------- */

    ctx.lineWidth = 1;

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        const radius =
            radarRadius * i / 4;

        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            radius,
            Math.PI,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "#0b4028";

        ctx.stroke();

        /* 거리 표시 */

        ctx.fillStyle =
            "#17633f";

        ctx.font =
            "12px Arial";

        ctx.fillText(
            Math.round(300 * i / 4) + "cm",
            centerX + 5,
            centerY - radius + 15
        );
    }

    /* ---------------------
       각도선
    --------------------- */

    for (
        let deg = 0;
        deg <= 180;
        deg += 30
    ) {

        const point =
            polarToScreen(
                deg,
                radarRadius
            );

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            centerY
        );

        ctx.lineTo(
            point.x,
            point.y
        );

        ctx.strokeStyle =
            "#0b4028";

        ctx.stroke();

        /* 각도 표시 */

        const label =
            polarToScreen(
                deg,
                radarRadius + 20
            );

        ctx.fillStyle =
            "#17633f";

        ctx.font =
            "12px Arial";

        ctx.fillText(
            deg + "°",
            label.x - 8,
            label.y
        );
    }

    /* ---------------------
       감지된 물체
    --------------------- */

    for (
        const [targetAngle, targetDistance]
        of targets
    ) {

        if (
            targetDistance >= 300
        ) {
            continue;
        }

        const radius =
            radarRadius *
            targetDistance /
            300;

        const point =
            polarToScreen(
                targetAngle,
                radius
            );

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            6,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ff4444";

        ctx.fill();

        /* 물체에서 중심까지 선 */

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            centerY
        );

        ctx.lineTo(
            point.x,
            point.y
        );

        ctx.strokeStyle =
            "rgba(255,68,68,0.25)";

        ctx.stroke();
    }

    /* ---------------------
       현재 스캔선
    --------------------- */

    const sweep =
        polarToScreen(
            currentAngle,
            radarRadius
        );

    ctx.beginPath();

    ctx.moveTo(
        centerX,
        centerY
    );

    ctx.lineTo(
        sweep.x,
        sweep.y
    );

    ctx.strokeStyle =
        "#00ff88";

    ctx.lineWidth = 3;

    ctx.stroke();

    /* ---------------------
       중심점
    --------------------- */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#00ff88";

    ctx.fill();

}

/* =====================================================
   애니메이션
===================================================== */

function animationLoop() {

    drawRadar();

    requestAnimationFrame(
        animationLoop
    );

}

animationLoop();

/* =====================================================
   데이터 업데이트
===================================================== */

function updateRadar(
    angle,
    distance
) {

    currentAngle =
        angle;

    currentDistance =
        distance;

    document
        .getElementById("angleValue")
        .textContent =
        angle;

    document
        .getElementById("distanceValue")
        .textContent =
        distance;

    /*
        300cm 미만만 물체로 취급
    */

    if (
        distance < 300
    ) {

        targets.set(
            angle,
            distance
        );

    }

    /*
        너무 오래된 각도 데이터가
        계속 남는 것을 방지하기 위해
        현재 각도 주변만 유지
    */

    for (
        const oldAngle
        of targets.keys()
    ) {

        if (
            Math.abs(
                oldAngle - angle
            ) > 45
        ) {

            targets.delete(
                oldAngle
            );

        }

    }

}

/* =====================================================
   Bluetooth
===================================================== */

/*
    micro:bit UART service
*/

const UART_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

/*
    micro:bit → 태블릿

    중요:
    6e400003 = TX / Notify

    6e400002 = RX / Write
*/

const UART_TX_CHARACTERISTIC =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let bluetoothDevice = null;

let uartCharacteristic = null;

/* =====================================================
   Bluetooth 연결
===================================================== */

async function connectBluetooth() {

    const status =
        document.getElementById(
            "status"
        );

    /* Web Bluetooth 지원 확인 */

    if (
        !navigator.bluetooth
    ) {

        status.textContent =
            "Web Bluetooth 미지원";

        alert(
            "이 브라우저에서는 Web Bluetooth를 사용할 수 없습니다."
        );

        return;
    }

    try {

        status.textContent =
            "기기 검색 중...";

        /*
            사용자가 버튼을 눌렀을 때만
            requestDevice를 호출해야 한다.
        */

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        services: [
                            UART_SERVICE
                        ]
                    }
                ]

            });

        status.textContent =
            "연결 중...";

        /*
            GATT 서버 연결
        */

        const server =
            await bluetoothDevice.gatt.connect();

        /*
            UART service 가져오기
        */

        const service =
            await server.getPrimaryService(
                UART_SERVICE
            );

        /*
            micro:bit가 보내는
            TX characteristic
        */

        uartCharacteristic =
            await service.getCharacteristic(
                UART_TX_CHARACTERISTIC
            );

        /*
            알림 활성화
        */

        await uartCharacteristic
            .startNotifications();

        uartCharacteristic
            .addEventListener(
                "characteristicvaluechanged",
                receiveBluetoothData
            );

        bluetoothDevice
            .addEventListener(
                "gattserverdisconnected",
                bluetoothDisconnected
            );

        connected = true;

        status.textContent =
            "● 연결됨";

        status.style.color =
            "#00ff88";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "연결 실패";

        alert(
            "Bluetooth 연결 실패\n\n" +
            error.message
        );

    }

}

/* =====================================================
   Bluetooth 데이터 수신
===================================================== */

const textDecoder =
    new TextDecoder("utf-8");

let receiveBuffer = "";

function receiveBluetoothData(event) {

    const value =
        event.target.value;

    const text =
        textDecoder.decode(value);

    /*
        Bluetooth 데이터가
        여러 조각으로 나뉘어 들어올 수 있으므로
        버퍼에 합친다.
    */

    receiveBuffer += text;

    /*
        줄바꿈 기준으로 분리
    */

    const lines =
        receiveBuffer.split("\n");

    /*
        마지막 데이터는
        아직 완성되지 않았을 수 있음
    */

    receiveBuffer =
        lines.pop();

    for (
        let line of lines
    ) {

        line =
            line.trim();

        if (
            line.length === 0
        ) {

            continue;

        }

        parseRadarData(line);

    }

}

/* =====================================================
   데이터 해석
===================================================== */

function parseRadarData(data) {

    console.log(
        "받은 데이터:",
        data
    );

    /*
        예상:

        90,43

        = 90도 / 43cm
    */

    const parts =
        data.split(",");

    if (
        parts.length !== 2
    ) {

        return;

    }

    const angle =
        Number(
            parts[0]
        );

    const distance =
        Number(
            parts[1]
        );

    if (
        !Number.isFinite(angle) ||
        !Number.isFinite(distance)
    ) {

        return;

    }

    if (
        angle < 0 ||
        angle > 180
    ) {

        return;

    }

    updateRadar(
        angle,
        distance
    );

}

/* =====================================================
   연결 끊김
===================================================== */

function bluetoothDisconnected() {

    connected = false;

    document
        .getElementById("status")
        .textContent =
        "연결 끊김";

    document
        .getElementById("status")
        .style.color =
        "#ff5555";

}

/* =====================================================
   연결 버튼
===================================================== */

document
    .getElementById("connectButton")
    .addEventListener(
        "click",
        connectBluetooth
    );

</script>

</body>

</html>
